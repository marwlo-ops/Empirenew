name: Validate Barony map and mobile UI

on:
  push:
    branches: ["**"]
    paths:
      - "barony.html"
      - "scripts/test-barony-mobile.mjs"
      - "scripts/test-baron-map-catalog.mjs"
      - "scripts/test-baron-import-workflows.mjs"
      - ".github/workflows/baron-map-import.yml"
      - ".github/workflows/import-it1-fortresses.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: empirenew-barony-ui-validation
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify there is exactly one scheduled map publisher
        run: node scripts/test-baron-import-workflows.mjs
      - name: Test Barony mobile layout and local-history labels
        run: node scripts/test-barony-mobile.mjs
      - name: Validate existing map-only catalog
        run: node scripts/test-baron-map-catalog.mjs
