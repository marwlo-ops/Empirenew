name: Import IT1 fortress map

on:
  push:
    branches: ["**"]
    paths:
      - "scripts/import-baron-map.js"
      - ".github/workflows/baron-map-import.yml"
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: empirenew-it1-map-import
  cancel-in-progress: false

jobs:
  import-map:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate and import map-only data
        run: |
          node --check scripts/import-baron-map.js
          node scripts/import-baron-map.js
      - name: Commit imported IT1 map
        run: |
          if [[ -n "$(git status --porcelain data/baron-fortresses.json)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/baron-fortresses.json
            git commit -m "data: import IT1 fortress map coordinates"
            git push origin HEAD:"${GITHUB_REF_NAME}"
          else
            echo "IT1 map has no changes."
          fi
