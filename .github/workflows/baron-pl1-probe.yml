name: Probe PL1 fortress API

on:
  push:
    branches: ["**"]
    paths:
      - "scripts/probe-baron-pl1.js"
      - "scripts/probe-pl1-live-map.py"
      - "tests/test_probe_pl1_live_map.py"
      - "scripts/test-barony-mobile.mjs"
      - "scripts/test-baron-map-catalog.mjs"
      - "scripts/barony-live/**"
      - "scripts/import_it1_fortresses.py"
      - "tests/test_import_it1_fortresses.py"
      - ".github/workflows/import-it1-fortresses.yml"
      - "research/fortece-barona-status.md"
      - ".github/workflows/baron-pl1-probe.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test local PL1 map probe offline
        run: |
          python -m py_compile scripts/probe-pl1-live-map.py
          python -m unittest discover -s tests -p "test_probe_pl1_live_map.py" -v
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test E4K PL1 read-only probe core
        run: |
          node --check scripts/barony-live/probe.mjs
          node --check scripts/barony-live/reports.mjs
          node --check scripts/barony-live/probe-core.mjs
          node --check scripts/barony-live/prepare-e4k-data.mjs
          node --test scripts/barony-live/probe-core.test.mjs
          node scripts/barony-live/probe.mjs --plan --all > "$RUNNER_TEMP/barony-plan.json"
          node - <<'NODE'
          const fs = require('node:fs');
          const catalog = JSON.parse(fs.readFileSync('data/baron-fortresses.json', 'utf8'));
          const plan = JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP + '/barony-plan.json', 'utf8'));
          if (plan.target_count !== catalog.total_count) throw new Error('Plan target count differs from the validated map catalog.');
          if (plan.sector_count < 1 || plan.estimated_map_tiles !== plan.sector_count * 10000) throw new Error('Invalid 100x100 sector plan.');
          console.log(JSON.stringify({targets: plan.target_count, sectors: plan.sector_count, estimated_map_tiles: plan.estimated_map_tiles}));
          NODE
      - name: Verify pinned E4K client and PL1 server metadata
        run: |
          npm install --prefix scripts/barony-live --ignore-scripts --no-audit --no-fund
          node scripts/barony-live/prepare-e4k-data.mjs
          node - <<'NODE'
          const fs = require('node:fs');
          const { network } = require('./scripts/barony-live/node_modules/e4k-data');
          const { E4KClient } = require('./scripts/barony-live/node_modules/ggejs');
          const pl1 = network.instances.find(x => x.zone === 'EmpirefourkingdomsExGG_3');
          if (!pl1 || pl1.server !== 'e4k-live-pl1-game.goodgamestudios.com' || pl1.value !== 3 || pl1.zoneId !== 259 || pl1.instanceLocaId !== 'generic_country_PL') throw new Error('Pinned e4k-data does not identify the expected PL1 production endpoint.');
          if (typeof E4KClient !== 'function') throw new Error('Pinned ggejs does not export E4KClient.');
          const root = './scripts/barony-live/node_modules/ggejs/src';
          const socket = fs.readFileSync(root + '/managers/SocketManager.js', 'utf8');
          const bossDungeon = fs.readFileSync(root + '/structures/mapobjects/BossDungeonMapobject.js', 'utf8');
          const regularDungeon = fs.readFileSync(root + '/structures/mapobjects/DungeonMapobject.js', 'utf8');
          const parser = fs.readFileSync(root + '/utils/MapObjectParser.js', 'utf8');
          const owners = fs.readFileSync(root + '/utils/WorldMapOwnerInfoData.js', 'utf8');
          if (!socket.includes("serverInstance.zone.startsWith('EmpirefourkingdomsExGG') ? 'tcp' : 'wss'")) throw new Error('E4K TCP transport selection is not present in pinned ggejs.');
          if (!bossDungeon.includes('this.attackCooldownEnd = new Date(Date.now() + data[5] * 1000)') || !bossDungeon.includes('this.defeaterPlayerId = data[6]') || !bossDungeon.includes('this.kingdomId = data[7]')) throw new Error('BossDungeonMapobject type 11 field mapping changed.');
          if (!parser.includes('case 11:') || !parser.includes('return new BossDungeonMapobject(client, data)')) throw new Error('Type 11 rows are not parsed by BossDungeonMapobject.');
          if (!owners.includes('getKingdomBossDungeonOwnerByKingdomId = (kID) => this.getOwnerInfo(-229 - kID)')) throw new Error('Boss dungeon NPC owner mapping changed.');
          if (!regularDungeon.includes('this.attackCount = data[4]') || !regularDungeon.includes('this.kingdomId = data[6]')) throw new Error('Type 2 DungeonMapobject distinction changed.');
          console.log(JSON.stringify({zone: pl1.zone, host: pl1.server, instance: pl1.value, zone_id: pl1.zoneId, loca_id: pl1.instanceLocaId, network_version: network.versionNo, network_deploy_time: new Date(network.deployTime * 1000).toISOString(), transport: 'TCP', target_map_type: 11, boss_owner_ids_by_kid: [-230,-231,-232], e4k_client_export: 'PASS'}));
          NODE
      - name: Test Barony mobile UI
        run: node scripts/test-barony-mobile.mjs
      - name: Validate published IT1 map catalog
        run: node scripts/test-baron-map-catalog.mjs
      - name: Probe read-only PL1 dungeon map API
        run: node scripts/probe-baron-pl1.js
