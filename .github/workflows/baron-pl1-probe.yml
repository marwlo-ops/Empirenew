name: Probe PL1 fortress API

on:
  push:
    branches: ["**"]
    paths:
      - "scripts/probe-baron-pl1.js"
      - ".github/workflows/baron-pl1-probe.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Probe read-only PL1 dungeon map API
        run: node scripts/probe-baron-pl1.js
