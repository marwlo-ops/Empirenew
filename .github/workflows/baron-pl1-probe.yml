name: Probe PL1 fortress API

on:
  push:
    branches: ["**"]
    paths:
      - "scripts/probe-baron-pl1.js"
      - "scripts/probe-pl1-live-map.py"
      - "tests/test_probe_pl1_live_map.py"
      - "scripts/test-barony-mobile.mjs"
      - "scripts/test-baron-map-catalog.mjs"
      - ".github/workflows/baron-pl1-probe.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test local PL1 map probe offline
        run: |
          python -m py_compile scripts/probe-pl1-live-map.py
          python -m unittest discover -s tests -p "test_probe_pl1_live_map.py" -v
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Test Barony mobile UI
        run: node scripts/test-barony-mobile.mjs
      - name: Validate published IT1 map catalog
        run: node scripts/test-baron-map-catalog.mjs
      - name: Probe read-only PL1 dungeon map API
        run: node scripts/probe-baron-pl1.js
