name: Refresh IT1 fortress map catalog

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: write

concurrency:
  group: empire-new-it1-map
  cancel-in-progress: false

jobs:
  import-map:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Test importer validation
        run: python -m unittest discover -s tests -v
      - name: Import map-only data from GGE Tracker IT1
        run: python scripts/import_it1_fortresses.py
      - name: Commit updated map catalog
        run: |
          if git diff --quiet -- data/baron-fortresses.json; then
            echo "No map changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/baron-fortresses.json
          git commit -m "chore: refresh IT1 fortress map catalog"
          git pull --rebase origin main
          git push
