# Manual push to this workflow file can be used to request an immediate fresh snapshot.
name: Empirenew location tracker
on:
  push:
    paths:
      - "api/e4k-client.js"
      - "scripts/probe-server-ranking.js"
      - "scripts/server-intel-tracker.js"
      - ".github/workflows/tracker.yml"
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: empirenew-location-tracker
  cancel-in-progress: false
jobs:
  update-location-history:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate JavaScript
        run: node --check scripts/location-tracker.js && node --check scripts/server-intel-tracker.js && node --check api/e4k-client.js
      - name: Fetch and compare alliance locations
        run: node scripts/location-tracker.js
      - name: Build server-wide intelligence snapshots
        run: node scripts/server-intel-tracker.js
      - name: Commit shared history
        run: |
          if [[ -n "$(git status --porcelain data/location-snapshots.json data/location-history.json data/outpost-history.json data/server-intel-snapshot.json data/server-intel-history.json data/tracker-rb.json)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/location-snapshots.json data/location-history.json data/outpost-history.json data/server-intel-snapshot.json data/server-intel-history.json data/tracker-rb.json
            git commit -m "chore: update shared location history"
            git pull --rebase origin main
            git push
          else
            echo "No location changes."
          fi
