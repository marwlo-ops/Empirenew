name: Validate Tracker RB
on:
  push:
    paths:
      - "tracker-rb.html"
      - "scripts/server-intel-tracker.js"
      - "api/e4k-client.js"
      - ".github/workflows/validate-tracker-rb.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate backend JavaScript
        run: node --check scripts/server-intel-tracker.js && node --check api/e4k-client.js
      - name: Extract, syntax-check and regression-check Tracker RB
        run: |
          node --input-type=commonjs <<'NODE'
          const fs = require("node:fs");
          const html = fs.readFileSync("tracker-rb.html", "utf8");
          const start = html.lastIndexOf("<script>");
          const end = html.indexOf("</script>", start);
          if (!html.includes('id="alerts"')) throw new Error("Brak panelu alertów RB");
          if (start < 0 || end < 0) throw new Error("Tracker RB nie zawiera poprawnego skryptu");
          const script = html.slice(start + "<script>".length, end);
          fs.writeFileSync("/tmp/tracker-rb-inline.js", script);
          const checks = [
            ["filtr potwierdzonych używa statusu confirmed", script.includes("p._activity.status==='confirmed'")],
            ["panel ostatnich alertów jest zasilany danymi", script.includes('$("alerts").innerHTML=')],
            ["snapshot RB v2 jest walidowany", script.includes("next.schema_version!==2")],
            ["świeżość snapshotu ma próg ostrzegawczy", script.includes("sourceAge<=15")],
            ["sygnał pośredni do 60 min trafia do statusu recent", script.includes("Math.min(directAge,indirectAge)<=60")]
          ];
          for (const [name, ok] of checks) {
            console.log((ok ? "PASS " : "FAIL ") + name);
            if (!ok) process.exitCode = 1;
          }
          NODE
          node --check /tmp/tracker-rb-inline.js
